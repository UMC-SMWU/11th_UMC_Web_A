# 테스트 전용 설정. 실제 MySQL 대신 메모리 H2를 쓰고, 비밀값도 테스트용 가짜 값을 쓴다.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: test-secret-for-context-loading-only
  access-expiration: 3600
