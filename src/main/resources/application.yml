spring:
  application:
    name: study
  datasource:
    # 비밀번호 등 민감 정보는 코드에 적지 않고 환경변수로 받는다. (없으면 뒤의 기본값 사용)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:umc_week2}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 이미 만든 테이블을 쓰므로 validate: 엔티티와 테이블 구조가 맞는지만 확인한다. (테이블을 바꾸지 않는다)
      ddl-auto: validate
    # 컨트롤러가 아닌 곳(뷰 렌더링 단계)까지 DB 연결을 붙잡고 있지 않도록 끈다.
    open-in-view: false
    # ORM이 내부에서 실행하는 SQL을 콘솔에서 확인하기 위한 설정
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
