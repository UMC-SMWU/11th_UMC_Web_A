server:
  address: 0.0.0.0
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/movie_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # 운영 데이터는 앱 시작 시 자동 변경하지 않아요.
jwt:
  secret: ${JWT_SECRET}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}