<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>간이 프론트</title>
  </head>
  <body>
    <h2>간이 프론트 : 중복 체크 / 평점 조회</h2>

    <p>
      <input id="nickname" value="수현" />
      <button onclick="call(`/members/nickname/${encodeURIComponent(nickname.value)}`)">닉네임 중복 체크</button>
    </p>
    <p>
      <input id="email" value="noco@umc.com" />
      <button onclick="call(`/members/email/${encodeURIComponent(email.value)}`)">이메일 중복 체크</button>
    </p>
    <p>
      <input id="memberId" value="1" size="4" />
      <button onclick="call(`/members/${encodeURIComponent(memberId.value)}/ratings`)">평점 조회</button>
    </p>

    <pre id="result"></pre>

    <script>
      const BASE_URL = "http://localhost:8080";
      const result = document.getElementById("result");

      async function call(path) {
        result.textContent = "요청 중...";
        try {
          const res = await fetch(BASE_URL + path);
          const body = await res.json();
          result.textContent = `${res.status}\n` + JSON.stringify(body, null, 2);
        } catch (e) {
          // CORS 에러가 나면 응답을 읽을 수 없어 여기로 온다. 자세한 내용은 Console 탭 확인
          result.textContent = "실패: " + e.message;
        }
      }
    </script>
  </body>
</html>
